services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ttb-label-verifier:local
    ports:
      - "8000:8000"
    environment:
      TTB_ENVIRONMENT: local
      TTB_LOG_LEVEL: INFO
      # The optional Bedrock fallback stays off so that local runs make no
      # outbound calls. See docs/adr/0003-local-ocr-default-bedrock-optional.md.
      TTB_ENABLE_BEDROCK_FALLBACK: "false"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No volumes are mounted: nothing is persisted beyond the request lifecycle
    # (Decision D-9).
    restart: unless-stopped
