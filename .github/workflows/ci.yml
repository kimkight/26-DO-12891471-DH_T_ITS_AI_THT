name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # Tesseract is a system package, not a Python one, so it is not in either
      # lock file. Without it the integration tier skips itself rather than
      # failing, which would leave the OCR path untested while CI stayed green.
      # fonts-dejavu-core is installed for the same reason: samples/labelmaker.py
      # renders label artwork at test time and skips when no TrueType font is
      # present.
      - name: Install Tesseract and a TrueType font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-osd fonts-dejavu-core
          tesseract --version

      # This job lints and tests, so it needs the dev lock file:
      # requirements.lock carries the ocr and matching extras only, and has no
      # pytest or ruff in it. requirements-dev.lock is the same resolution plus
      # the dev extra, so the tools are the ones the runtime set resolved
      # against rather than whatever pip would pick alongside them.
      #
      # --require-hashes is explicit rather than left to pip's automatic
      # detection, so a lock file that lost its hashes fails here instead of
      # silently installing unverified wheels. The project itself follows with
      # --no-deps, which registers `app` on the path without letting pip
      # re-resolve anything the lock file already decided.
      #
      # Paths are relative to backend/ (the job's working directory).
      - name: Install backend from the dev lock file
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      # samples/ and scripts/ are linted with the same configuration as the
      # application. They hold real Python that the accuracy and performance
      # tiers depend on; leaving them outside the lint would create a corner of
      # the repository that CI never reads. The config is named explicitly
      # because neither directory has a pyproject.toml of its own.
      - name: Lint (ruff)
        run: ruff check --config pyproject.toml . ../samples ../scripts

      - name: Format check (ruff)
        run: ruff format --check --diff --config pyproject.toml . ../samples ../scripts

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: frontend lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # @playwright/test downloads browsers from its own postinstall script.
      # That would fetch every browser on `npm ci`, and then the explicit
      # install step below would fetch Chromium again. Skipping the postinstall
      # makes that step the single place a browser is downloaded, and makes it
      # visible in the log which one.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      # `prettier --check` reports only which files differ. On failure, rewrite
      # them and print the diff so the required change is visible in the log.
      - name: Format check (prettier)
        run: |
          npm run format:check || {
            npm run format
            git --no-pager diff -- src
            exit 1
          }

      - name: Build (tsc and vite)
        run: npm run build

      - name: Test (vitest)
        run: npm run test

      # The accessibility run needs a real browser. axe-core's colour-contrast
      # rule cannot be evaluated without a layout engine: under jsdom it
      # reports "incomplete" rather than "pass", so a jsdom run would go green
      # while never having checked the one NFR-5 criterion that is a number.
      # Chromium only, and --with-deps because the runner does not carry the
      # shared libraries it needs.
      - name: Install Chromium for the accessibility run
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: ""
        run: npx playwright install --with-deps chromium

      # Runs against `vite preview` serving dist/, started by
      # playwright.config.ts, so what is checked is the built page an agent
      # loads rather than a component rendered in isolation. Requires the
      # build step above.
      - name: Accessibility (axe-core against the built page)
        run: npm run test:a11y

      - name: Upload the accessibility report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: frontend/playwright-report/
          retention-days: 7

  infra:
    name: infrastructure format and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.13.3"
          # The wrapper rewrites stdout to capture step outputs, which nothing
          # here consumes and which makes a validate failure harder to read.
          terraform_wrapper: false

      - name: Format check (terraform fmt)
        run: terraform fmt -check -recursive -diff

      # -backend=false is what makes this job possible without AWS
      # credentials. It downloads the provider plugins, which is all
      # `validate` needs, and skips initialising a state backend, which is
      # the only step that would try to authenticate. Nothing in this job
      # reads or writes AWS.
      - name: Initialise without a backend
        run: terraform init -backend=false -input=false

      # Checks that every resource type, argument, and reference resolves
      # against the provider schema. It does not contact AWS and it does not
      # know what exists in any account: a green validate means the
      # configuration is well formed, not that an apply would succeed.
      - name: Validate
        run: terraform validate -no-color

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # Both lock files are audited directly rather than by scanning an
      # installed environment. --no-deps is what makes that sound: it tells
      # pip-audit to audit exactly the versions written in the file and to
      # refuse to resolve anything further, which is only valid because both
      # files are fully pinned. Nothing is installed, so nothing outside the
      # lock files can dilute or mask the result.
      #
      # Both are audited, not just one. requirements.lock is what ships in the
      # image, so it is the one that matters for the product; but an advisory
      # against a dev-only tool is still an advisory against something a
      # contributor runs, and requirements-dev.lock is a superset, so auditing
      # only the runtime file would leave the dev tools unchecked. Each step
      # gates independently: a finding in either fails the job.
      - name: Audit Python runtime dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.lock --no-deps --progress-spinner off

      - name: Audit Python development dependencies (pip-audit)
        run: pip-audit -r backend/requirements-dev.lock --no-deps --progress-spinner off

      # Skips the Playwright postinstall browser download: this job audits the
      # dependency tree and never opens a browser.
      - name: Audit Node dependencies (npm audit)
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  container:
    name: container build and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: ttb-label-verifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves the health endpoint
        run: |
          docker run -d --name verifier -p 8000:8000 ttb-label-verifier:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/health; then
              echo "health check passed on attempt ${attempt}"
              docker rm -f verifier
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not respond within 60 seconds"
          docker logs verifier
          docker rm -f verifier
          exit 1

      - name: Confirm the image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id ttb-label-verifier:${{ github.sha }} -u)
          echo "container uid: ${uid}"
          test "${uid}" != "0"

      # A .env file anywhere in the tree must not reach the build context
      # (code review finding 28). The frontend stage copies frontend/ whole,
      # and Vite inlines any VITE_* value it finds in a .env.local there into
      # the public bundle; .dockerignore excluded .env files at the root only.
      # This plants one at each depth, builds the frontend stage from that
      # context, and asserts that no .env file is in the stage and that the
      # planted value is not in the bundle. It fails if .dockerignore loses
      # the `**/` rule, which is the regression it exists to catch.
      - name: Plant .env files that must not reach the build
        run: |
          printf 'VITE_PLANTED=planted-by-ci-must-not-ship\n' > frontend/.env.local
          printf 'VITE_PLANTED=planted-by-ci-must-not-ship\n' > frontend/.env
          printf 'TTB_PLANTED=planted-by-ci-must-not-ship\n' > backend/.env
          printf 'PLANTED=planted-by-ci-must-not-ship\n' > .env.production

      - name: Build the frontend stage from the planted context
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: frontend-build
          push: false
          load: true
          tags: ttb-context-check:${{ github.sha }}
          cache-from: type=gha

      - name: Prove no .env file reaches the build
        run: |
          rm -f frontend/.env.local frontend/.env backend/.env .env.production
          found=$(docker run --rm --entrypoint sh ttb-context-check:${{ github.sha }} \
            -c 'find /build -path /build/node_modules -prune -o \( -name ".env" -o -name ".env.*" \) -print | grep -v "/.env.example$" || true')
          if [ -n "${found}" ]; then
            echo "::error::A .env file reached the build context:"
            echo "${found}"
            exit 1
          fi
          if docker run --rm --entrypoint sh ttb-context-check:${{ github.sha }} \
            -c 'grep -rq "planted-by-ci-must-not-ship" /build/dist'; then
            echo "::error::A planted VITE_ value was inlined into the built bundle."
            exit 1
          fi
          echo "No .env file reached the build context, and the bundle carries nothing planted."

      # Records the Tesseract version actually shipped in the image. The
      # initializing session could not install Tesseract locally, so this is
      # the authoritative source for docs/05_ARCHITECTURE.md (OQ-2).
      - name: Report the Tesseract version in the image
        run: |
          version=$(docker run --rm --entrypoint tesseract \
            ttb-label-verifier:${{ github.sha }} --version 2>&1)
          echo "${version}"
          # Also surface it on the run summary page so it can be read without
          # scrolling the build log.
          {
            echo "### Tesseract version in the image"
            echo ""
            echo '```'
            echo "${version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ttb-label-verifier:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  # Single aggregating check. Branch protection requires this one context, so
  # adding or renaming a job above does not require reconfiguring protection.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [backend, frontend, infra, audit, container]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          echo "backend:   ${{ needs.backend.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"
          echo "infra:     ${{ needs.infra.result }}"
          echo "audit:     ${{ needs.audit.result }}"
          echo "container: ${{ needs.container.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
