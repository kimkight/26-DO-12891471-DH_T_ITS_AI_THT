name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      # Tesseract is a system package, not a Python one, so it is not in either
      # lock file. Without it the integration tier skips itself rather than
      # failing, which would leave the OCR path untested while CI stayed green.
      # fonts-dejavu-core is installed for the same reason: samples/labelmaker.py
      # renders label artwork at test time and skips when no TrueType font is
      # present.
      - name: Install Tesseract and a TrueType font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
          tesseract --version

      # This job lints and tests, so it needs the dev lock file:
      # requirements.lock carries the ocr and matching extras only, and has no
      # pytest or ruff in it. requirements-dev.lock is the same resolution plus
      # the dev extra, so the tools are the ones the runtime set resolved
      # against rather than whatever pip would pick alongside them.
      #
      # --require-hashes is explicit rather than left to pip's automatic
      # detection, so a lock file that lost its hashes fails here instead of
      # silently installing unverified wheels. The project itself follows with
      # --no-deps, which registers `app` on the path without letting pip
      # re-resolve anything the lock file already decided.
      #
      # Paths are relative to backend/ (the job's working directory).
      - name: Install backend from the dev lock file
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      # samples/ and scripts/ are linted with the same configuration as the
      # application. They hold real Python that the accuracy and performance
      # tiers depend on; leaving them outside the lint would create a corner of
      # the repository that CI never reads. The config is named explicitly
      # because neither directory has a pyproject.toml of its own.
      - name: Lint (ruff)
        run: ruff check --config pyproject.toml . ../samples ../scripts

      - name: Format check (ruff)
        run: ruff format --check --diff --config pyproject.toml . ../samples ../scripts

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      # `prettier --check` reports only which files differ. On failure, rewrite
      # them and print the diff so the required change is visible in the log.
      - name: Format check (prettier)
        run: |
          npm run format:check || {
            npm run format
            git --no-pager diff -- src
            exit 1
          }

      - name: Build (tsc and vite)
        run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Both lock files are audited directly rather than by scanning an
      # installed environment. --no-deps is what makes that sound: it tells
      # pip-audit to audit exactly the versions written in the file and to
      # refuse to resolve anything further, which is only valid because both
      # files are fully pinned. Nothing is installed, so nothing outside the
      # lock files can dilute or mask the result.
      #
      # Both are audited, not just one. requirements.lock is what ships in the
      # image, so it is the one that matters for the product; but an advisory
      # against a dev-only tool is still an advisory against something a
      # contributor runs, and requirements-dev.lock is a superset, so auditing
      # only the runtime file would leave the dev tools unchecked. Each step
      # gates independently: a finding in either fails the job.
      - name: Audit Python runtime dependencies (pip-audit)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r backend/requirements.lock --no-deps --progress-spinner off

      - name: Audit Python development dependencies (pip-audit)
        run: pip-audit -r backend/requirements-dev.lock --no-deps --progress-spinner off

      - name: Audit Node dependencies (npm audit)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  container:
    name: container build and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: ttb-label-verifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves the health endpoint
        run: |
          docker run -d --name verifier -p 8000:8000 ttb-label-verifier:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/health; then
              echo "health check passed on attempt ${attempt}"
              docker rm -f verifier
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not respond within 60 seconds"
          docker logs verifier
          docker rm -f verifier
          exit 1

      - name: Confirm the image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id ttb-label-verifier:${{ github.sha }} -u)
          echo "container uid: ${uid}"
          test "${uid}" != "0"

      # Records the Tesseract version actually shipped in the image. The
      # initializing session could not install Tesseract locally, so this is
      # the authoritative source for docs/05_ARCHITECTURE.md (OQ-2).
      - name: Report the Tesseract version in the image
        run: |
          version=$(docker run --rm --entrypoint tesseract \
            ttb-label-verifier:${{ github.sha }} --version 2>&1)
          echo "${version}"
          # Also surface it on the run summary page so it can be read without
          # scrolling the build log.
          {
            echo "### Tesseract version in the image"
            echo ""
            echo '```'
            echo "${version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ttb-label-verifier:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  # Single aggregating check. Branch protection requires this one context, so
  # adding or renaming a job above does not require reconfiguring protection.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [backend, frontend, audit, container]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          echo "backend:   ${{ needs.backend.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"
          echo "audit:     ${{ needs.audit.result }}"
          echo "container: ${{ needs.container.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
