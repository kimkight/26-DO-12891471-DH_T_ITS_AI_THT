name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with development extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,matching]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (pytest)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No package-lock.json is committed yet (docs/OPEN_QUESTIONS.md, OQ-3),
      # so `npm ci` cannot be used. Switch to `npm ci` once a lockfile exists.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Build (tsc and vite)
        run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit Python dependencies (pip-audit)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.7.3
          pip install -e ".[matching]"
          pip-audit --strict --progress-spinner off

      - name: Audit Node dependencies (npm audit)
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high

  container:
    name: container build and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ttb-label-verifier:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the container serves the health endpoint
        run: |
          docker run -d --name verifier -p 8000:8000 ttb-label-verifier:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/api/health; then
              echo "health check passed on attempt ${attempt}"
              docker rm -f verifier
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not respond within 60 seconds"
          docker logs verifier
          docker rm -f verifier
          exit 1

      - name: Confirm the image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id ttb-label-verifier:${{ github.sha }} -u)
          echo "container uid: ${uid}"
          test "${uid}" != "0"

      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@v0
        with:
          image: ttb-label-verifier:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 30

  # Single aggregating check. Branch protection requires this one context, so
  # adding or renaming a job above does not require reconfiguring protection.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [backend, frontend, audit, container]
    if: always()
    steps:
      - name: Fail if any upstream job did not succeed
        run: |
          echo "backend:   ${{ needs.backend.result }}"
          echo "frontend:  ${{ needs.frontend.result }}"
          echo "audit:     ${{ needs.audit.result }}"
          echo "container: ${{ needs.container.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
