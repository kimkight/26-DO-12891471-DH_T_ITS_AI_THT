name: deploy

# ---------------------------------------------------------------------------
# Builds the container image, pushes it to ECR, and points the ECS service at
# the digest that push produced.
#
# This workflow is enabled. It runs only on its own triggers, so no pull
# request and no push to develop can start it, and CI never needs AWS
# credentials.
#
# It authenticates with GitHub's OIDC token and assumes an IAM role whose trust
# policy names this repository at the refs that may deploy: develop, main and
# a v* tag (infra/terraform/locals.tf). No static AWS access key exists
# anywhere in this system (Decision D-8). The role's trust policy and
# permissions are in infra/terraform/iam.tf.
#
# No job declares a GitHub environment. The `production` environment on this
# repository carries no deployment-branch policy and no protection rules, so a
# job that named it would gain nothing and would present an environment-scoped
# OIDC subject that any branch can obtain (code review finding 11, #110). The
# ref is the control; docs/06_SECURITY_AND_COMPLIANCE.md section 2 says why
# and what would change it.
#
# Every action is pinned by commit SHA with the version it was resolved from
# beside it (finding 12, #111). Two of the jobs hold an AWS session for up to
# an hour; a tag can be moved under a job that holds one, a commit cannot.
# Dependabot's github-actions ecosystem understands the SHA-plus-comment form
# and proposes the bump with both updated.
#
# Before the first run, the infrastructure has to exist and six repository
# variables have to be set. The preflight job below fails with a readable list
# if any is missing, rather than letting the build run and the deploy step fail
# on an empty role ARN. Settings > Secrets and variables > Actions > Variables:
#
#   AWS_REGION           us-east-1
#   AWS_ROLE_ARN         terraform output deploy_role_arn
#   ECR_REPOSITORY       terraform output ecr_repository_name
#   ECS_CLUSTER          terraform output ecs_cluster_name
#   ECS_SERVICE          terraform output ecs_service_name
#   ECS_CONTAINER_NAME   terraform output ecs_container_name
#
# These are configuration, not secrets, which is why they are variables rather
# than secrets. AWS_ROLE_ARN does contain the AWS account number, and that is
# the reason it is a repository variable instead of a committed string.
#
# The full runbook is docs/09_DEPLOYMENT.md.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to push the image under. Defaults to the short commit SHA. A release-shaped tag (v1, v1.2.0) is refused; releases come from the release trigger."
        required: false
        type: string
  release:
    types: [published]

# The workflow default is read-only. id-token: write is granted to the two
# jobs that assume the AWS role and to no other; contents: write is granted to
# the one job that attaches the SBOM to a release and to no other.
permissions:
  contents: read

# One deployment at a time. Two concurrent runs would race on the same ECS
# service and the loser would win, because whichever UpdateService lands last
# decides what runs. cancel-in-progress is false: a cancelled deploy leaves a
# half-finished rollout rather than no rollout.
concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------------
  # Fail early and legibly when the repository is not configured, rather than
  # half-running. Every missing variable is reported in one pass, so the
  # operator sets all of them once instead of discovering them one run at a
  # time. This job touches no AWS API and needs no credentials.
  # -------------------------------------------------------------------------
  preflight:
    name: check the repository variables
    runs-on: ubuntu-latest
    steps:
      - name: Require every deployment variable
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_CONTAINER_NAME: ${{ vars.ECS_CONTAINER_NAME }}
        run: |
          missing=()
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER \
                      ECS_SERVICE ECS_CONTAINER_NAME; do
            if [ -z "${!name}" ]; then
              missing+=("${name}")
            fi
          done

          if [ ${#missing[@]} -ne 0 ]; then
            {
              echo "### Deployment is not configured"
              echo ""
              echo "These repository variables are unset:"
              echo ""
              for name in "${missing[@]}"; do
                echo "- \`${name}\`"
              done
              echo ""
              echo "Set them under Settings > Secrets and variables > Actions >"
              echo "Variables. The values come from \`terraform output\` in"
              echo "\`infra/terraform\`; see \`docs/09_DEPLOYMENT.md\` section 6."
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "All six deployment variables are set."

      # A manual dispatch must not push under a tag shaped like a release
      # (code review finding 27). This step is the control. The registry is
      # MUTABLE, so that a re-run of this workflow on the same commit can push
      # the same `sha-` tag again (infra/terraform/ecr.tf says why immutability
      # was applied and reverted; docs/OPEN_QUESTIONS.md OQ-34 records the
      # decision), and nothing downstream would refuse the push. This refuses
      # it here, before a build, with a sentence that says why.
      - name: Refuse a dispatch tag shaped like a release
        if: github.event_name == 'workflow_dispatch' && inputs.image_tag != ''
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ "${INPUT_TAG}" =~ ^v[0-9] ]]; then
            echo "::error::image_tag '${INPUT_TAG}' is shaped like a release tag. Releases are pushed by the release trigger under their own tag; a dispatch may not reuse or pre-empt one."
            exit 1
          fi
          echo "Dispatch tag '${INPUT_TAG}' is not release-shaped."

      # A release deploys an image named for its tag, and the image reports the
      # version pyproject.toml declares. The two have to agree, or /api/health
      # names a build the tag does not: v1.2.0 shipped reporting 1.1.0 because
      # nothing checked. A manual dispatch is not a release and is not checked.
      - name: Require the release tag to match the declared version
        if: github.event_name == 'release'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare the release tag with pyproject.toml
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          declared=$(python3 -c "import tomllib;print(tomllib.load(open('backend/pyproject.toml','rb'))['project']['version'])")
          if [ "v${declared}" != "${RELEASE_TAG}" ]; then
            echo "::error::Release tag ${RELEASE_TAG} does not match backend/pyproject.toml version ${declared}. Bump the version (docs/08_SDLC_PROCESS.md section 7, step 1) before publishing."
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} matches the declared version."

  build-and-push:
    name: build and push image
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.image.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Adopted at v6 directly, from v4, which is what pull request #27 was
      # held for: the action is used only here, so CI could never exercise the
      # bump and merging it while this workflow was disabled would have proved
      # nothing. See docs/DEPENDENCY_TRIAGE_2026-08.md.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # A release names its own tag. A manual run takes the input if one was
      # given and otherwise the short SHA, so a dispatch always produces a tag
      # that identifies the commit it came from.
      - name: Choose the image tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "${RELEASE_TAG}" ]; then
            tag="${RELEASE_TAG}"
          elif [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${tag}"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          # The runtime is x86_64, and the task definition says so
          # (runtime_platform in infra/terraform/ecs.tf). Building for one
          # platform explicitly means an architecture mismatch fails here
          # rather than at task start.
          platforms: linux/amd64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The tag is how a human finds the image; the digest is what gets
      # deployed. A tag can be moved by the next push, and a service that
      # references one would silently change what it runs the next time a task
      # restarts. The digest cannot move.
      - name: Resolve the pushed image by digest
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          TAG: ${{ steps.tag.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "${DIGEST}" ]; then
            echo "::error::The build step returned no image digest."
            exit 1
          fi
          image="${REGISTRY}/${REPOSITORY}@${DIGEST}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "### Image pushed"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Digest | \`${DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The SBOM of the image that was pushed, taken from the registry by the
      # digest that will be deployed, rather than of a separate build on a
      # different trigger (code review finding 13, #112). Syft reads the
      # registry credentials the ECR login left in the runner's Docker
      # configuration. The artifact is named by the digest so that the
      # question "what is in the image the service is running" has an answer
      # for as long as the artifact lives; a release carries it permanently,
      # attached by the job below.
      - name: Generate the SBOM of the pushed image (syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.image.outputs.image }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Name the SBOM by its digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          short="${DIGEST#sha256:}"
          echo "SBOM_NAME=sbom-${short::12}" >> "$GITHUB_ENV"
          jq --arg image "${{ steps.image.outputs.image }}" '.name = $image' sbom.spdx.json > "sbom-${short::12}.spdx.json"
          ls -l "sbom-${short::12}.spdx.json"

      - name: Upload the SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SBOM_NAME }}
          path: sbom-*.spdx.json
          retention-days: 90

  deploy:
    name: deploy to ECS
    needs: [preflight, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: deploy-${{ github.run_id }}

      # The task definition is read from AWS rather than from a file in this
      # repository. Two reasons, and the first is a hard one: a committed task
      # definition would have to carry the execution role ARN, which contains
      # the AWS account number, and no account identifier is committed to this
      # repository. The second is ownership: Terraform owns the shape of the
      # task definition, and this job owns one field of it, the image
      # (ADR 0019).
      #
      # It reads the LATEST revision of the family, not the revision the
      # service is running. The service runs whatever the previous deploy
      # registered; a `terraform apply` that changed a size or a cap registers
      # a newer revision and, by design, does not move the service
      # (`ignore_changes` in ecs.tf). Reading the service's revision carried
      # the old shape forward on every deploy and no Terraform change could
      # ever reach the service (code review finding 10, #109). Reading the
      # family's latest picks up Terraform's revision when there is one and
      # the previous deploy's otherwise, and both carry Terraform's shape.
      #
      # The query strips the read-only fields the API adds
      # (taskDefinitionArn, revision, status, requiresAttributes,
      # compatibilities, registeredAt, registeredBy). RegisterTaskDefinition
      # rejects them.
      - name: Read the latest revision of the task definition family
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE: ${{ vars.ECS_SERVICE }}
        run: |
          # The service names its running revision by ARN, and the family is
          # the ARN's last path segment before the revision number. A service
          # that does not exist comes back as a failure entry rather than an
          # error, so the query prints "None" and the guard below catches it.
          current=$(aws ecs describe-services \
            --cluster "${CLUSTER}" --services "${SERVICE}" \
            --query 'services[0].taskDefinition' --output text)

          if [ -z "${current}" ] || [ "${current}" = "None" ]; then
            echo "::error::Service ${SERVICE} was not found in cluster ${CLUSTER}. Has the Terraform in infra/terraform been applied?"
            exit 1
          fi

          family_and_revision="${current##*/}"
          family="${family_and_revision%%:*}"
          echo "Service is running: ${current}"
          echo "Task definition family: ${family}"

          latest=$(aws ecs describe-task-definition \
            --task-definition "${family}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Latest revision of the family: ${latest}"
          if [ "${latest}" != "${current}" ]; then
            echo "The latest revision is newer than the one the service runs; its shape (a Terraform apply since the last deploy) goes into service with this image."
          fi

          aws ecs describe-task-definition \
            --task-definition "${family}" \
            --query 'taskDefinition | {
              family: family,
              taskRoleArn: taskRoleArn,
              executionRoleArn: executionRoleArn,
              networkMode: networkMode,
              containerDefinitions: containerDefinitions,
              volumes: volumes,
              placementConstraints: placementConstraints,
              requiresCompatibilities: requiresCompatibilities,
              cpu: cpu,
              memory: memory,
              runtimePlatform: runtimePlatform
            }' \
            --output json > task-definition.json

      - name: Render the task definition with the new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1.9.0
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ needs.build-and-push.outputs.image }}

      # wait-for-service-stability turns a deployment that never becomes
      # healthy into a failed workflow run. Without it the run goes green the
      # moment UpdateService is accepted, which says nothing about whether the
      # new task ever passed a health check. The service's circuit breaker
      # rolls the deployment back; this is what makes the rollback visible.
      - name: Deploy and wait for the service to stabilise
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2.6.3
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          wait-for-service-stability: true

      - name: Report what is running
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Tag | \`${TAG}\` |"
            echo "| Image | \`${IMAGE}\` |"
            echo ""
            echo "The URL is the load balancer DNS name from \`terraform output alb_dns_name\`."
            echo "Post-deploy verification is in \`docs/09_DEPLOYMENT.md\` section 8."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # A release keeps its SBOM. The artifact above expires; a release asset does
  # not, and it sits beside the tag a reader would look under. This job holds
  # the one write permission in the workflow and no AWS session, which is why
  # it is a job of its own rather than a step in build-and-push.
  # -------------------------------------------------------------------------
  attach-sbom:
    name: attach the SBOM to the release
    if: github.event_name == 'release'
    needs: [build-and-push, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: sbom-*
          merge-multiple: true

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          ls -l sbom-*.spdx.json
          gh release upload "${RELEASE_TAG}" sbom-*.spdx.json --repo "${GITHUB_REPOSITORY}" --clobber
          {
            echo "### SBOM attached to ${RELEASE_TAG}"
            echo ""
            echo "For image digest \`${DIGEST}\`."
          } >> "$GITHUB_STEP_SUMMARY"
