name: User story
description: A unit of user-facing value, traceable to a stakeholder statement.
title: "[Story] "
labels: ["type:story"]
body:
  - type: markdown
    attributes:
      value: |
        Every story must trace to a source in `docs/`. Stories without a source
        tag are rejected at refinement; see `docs/08_SDLC_PROCESS.md`.
  - type: input
    id: story-id
    attributes:
      label: Story ID
      description: The identifier used in docs/04_USER_STORIES.md, for example US-3.
      placeholder: US-0
    validations:
      required: true
  - type: textarea
    id: story
    attributes:
      label: Story
      description: Written from the perspective of a persona named in the interviews.
      placeholder: |
        As a compliance agent,
        I want ...,
        so that ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: One or more Given / When / Then scenarios.
      placeholder: |
        Given ...
        When ...
        Then ...
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Traceability tag, for example "Sarah Chen interview" or "Decision D-5".
      placeholder: Sarah Chen interview
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Related requirement IDs
      description: Comma separated, for example FR-1, NFR-2.
    validations:
      required: false
  - type: input
    id: story-points
    attributes:
      label: Story points
      description: Left blank until estimated at refinement.
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes, assumptions, and open questions
      description: Anything inferred rather than stated must be marked "(Assumption)".
    validations:
      required: false
