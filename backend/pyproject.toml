[project]
name = "ttb-label-verifier-backend"
version = "1.0.0"
description = "Backend API for the TTB alcohol label verification prototype."
requires-python = ">=3.11"
authors = [{ name = "Kimberly D. Kight" }]
# Minimum versions, not exact pins. Exact pins written by hand went stale and
# pip-audit found seven advisories against the transitive starlette version they
# resolved to. Floors are set at or above the fixed versions; the resolver picks
# current releases and Dependabot raises the floors as advisories appear.
# Exact pins should be restored from a generated lockfile; see OQ-3.
dependencies = [
    "fastapi>=0.115.6",
    # Transitive through fastapi, constrained directly because advisories
    # PYSEC-2026-248, -249, -2280, -2281, -161, -1941 and -1942 affect earlier
    # versions. Highest required fix is 1.3.1.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
]

[project.optional-dependencies]
# Extraction and matching dependencies are declared now so that dependency
# auditing and SBOM generation cover the real runtime surface from day one.
# See docs/adr/0003-local-ocr-default-bedrock-optional.md and
# docs/adr/0004-fuzzy-matching-with-review-band.md.
ocr = [
    "pytesseract>=0.3.13",
    "opencv-python-headless>=4.11.0.86",
    "Pillow>=11.1.0",
    # Reads an uploaded COLA document: its AcroForm field values, its text
    # layer, and, where it has neither, its pages rendered to bitmaps for the
    # OCR fallback (FR-11, ADR 0008). One library rather than three because it
    # does all three, and it carries PDFium as a wheel, so nothing else has to
    # be installed in the image. Licensed BSD-3-Clause and Apache-2.0, which
    # matters here: the obvious alternative, PyMuPDF, is AGPL.
    "pypdfium2>=5.13.0",
]
matching = [
    "rapidfuzz>=3.11.0",
]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.9.2",
    "pip-audit>=2.7.3",
]

[build-system]
# 83.0.0 is the fix for PYSEC-2026-3447.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "RET", "SIM"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
