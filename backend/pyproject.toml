[project]
name = "ttb-label-verifier-backend"
version = "0.1.0"
description = "Backend API for the TTB alcohol label verification prototype."
requires-python = ">=3.11"
authors = [{ name = "Kimberly D. Kight" }]
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
# Extraction and matching dependencies are declared now so that dependency
# auditing and SBOM generation cover the real runtime surface from day one.
# See docs/adr/0003-local-ocr-default-bedrock-optional.md and
# docs/adr/0004-fuzzy-matching-with-review-band.md.
ocr = [
    "pytesseract==0.3.13",
    "opencv-python-headless==4.11.0.86",
    "Pillow==11.1.0",
]
matching = [
    "rapidfuzz==3.11.0",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "pip-audit==2.7.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "A", "C4", "PT", "RET", "SIM"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
